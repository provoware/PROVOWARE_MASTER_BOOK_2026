<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PROVOWARE Wissensspeicher</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <header>
    <div><strong>PROVOWARE Wissensspeicher</strong> · Iteration 003</div>
    <div>Nur-Lesen · Wissenseingang sichtbar</div>
  </header>
  <main>
    <aside>
      <button data-view="all" class="active">Entdecken</button>
      <button data-view="inbox">Wissenseingang</button>
      <button data-view="P0">P0 kritisch</button>
      <button data-view="regel">Regeln</button>
      <button data-view="standard">Standards</button>
      <button data-view="automatisierung">Automatisierung</button>
    </aside>
    <section>
      <div class="toolbar">
        <input id="search" type="search" aria-label="Wissen durchsuchen" placeholder="Wissen durchsuchen …">
        <span id="count" aria-live="polite"></span>
      </div>
      <div id="cards" class="cards"></div>
    </section>
    <aside id="detail" class="detail">
      <h2>Eintrag wählen</h2>
      <p>Was ist das? Warum wichtig? Was soll ich tun?</p>
    </aside>
  </main>
  <footer>Offline · keine persistente Nutzdatenänderung in Iteration 003</footer>
  <script src="src/seed.js"></script>
  <script src="src/inbox.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
