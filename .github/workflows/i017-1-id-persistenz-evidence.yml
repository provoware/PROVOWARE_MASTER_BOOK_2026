name: I017.1 ID-Persistenz-Evidence

on:
  pull_request:
    paths:
      - 'evidence/I017_1_ID_PERSISTENZ_KANDIDAT.json'
      - '.github/workflows/i017-1-id-persistenz-evidence.yml'
  workflow_dispatch:

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evidence fail-closed pruefen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('evidence/I017_1_ID_PERSISTENZ_KANDIDAT.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['id'] == 'ERK-I017-002'
          assert d['reifegrad'] == 'E1'
          assert d['prioritaet'] == 'P0'
          assert d['status'] == 'IN_PRUEFUNG'
          assert d['goldene_regel'] is False
          assert d['qualification']['status'] == 'AUSSTEHEND'
          assert d['dublettenpruefung']['kandidaten'] == ['ERK-I017-001']
          PY
