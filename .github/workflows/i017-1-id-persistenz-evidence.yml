name: I017.1 ID-Persistenz-Evidence

on:
  pull_request:
    paths:
      - 'evidence/I017_1_ID_PERSISTENZ_KANDIDAT.json'
      - '.github/workflows/i017-1-id-persistenz-evidence.yml'
  workflow_dispatch:

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evidence fail-closed pruefen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('evidence/I017_1_ID_PERSISTENZ_KANDIDAT.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['id'] == 'ERK-I017-002'
          assert d['reifegrad'] == 'E2'
          assert d['prioritaet'] == 'P0'
          assert d['status'] == 'BESTAETIGT'
          assert d['goldene_regel'] is False
          q = d['qualification']
          assert q['status'] == 'PASS_REAL'
          assert q['tool_pr'] == 40
          assert q['tool_qualifikations_head'] == '1a0a6d85e0547d6f1e0b395281a490828d40491c'
          assert q['tool_promotions_head'] == '739f0b8368ad79f418a800d5d98b5aea70e0ab54'
          assert q['tool_workflow_run_id'] == 31536871890
          assert q['tool_promotions_run_id'] == 31536951091
          assert q['tool_merge'] == '0d2e6c8d2e042527274fb2428efe635dbbb337cc'
          assert q['workflow_conclusion'] == 'success'
          assert d['dublettenpruefung']['kandidaten'] == ['ERK-I017-001']
          assert d['widersprueche'] == []
          PY
