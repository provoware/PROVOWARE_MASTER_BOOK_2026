name: Responsive Offline Browser Gate

on:
  push:
    branches: [main, dev/responsive-browser-800-zoom-20261024]
    paths:
      - 'src/style.css'
      - 'index.html'
      - 'preview.html'
      - 'src/**'
      - 'tests/test_responsive_browser.py'
      - '.github/workflows/responsive-offline-browser.yml'
      - 'docs/RELEASE_PFLICHTMATRIX.md'
      - 'README.md'
  pull_request:
    paths:
      - 'src/style.css'
      - 'index.html'
      - 'preview.html'
      - 'src/**'
      - 'tests/test_responsive_browser.py'
      - '.github/workflows/responsive-offline-browser.yml'
      - 'docs/RELEASE_PFLICHTMATRIX.md'
      - 'README.md'

permissions:
  contents: read

jobs:
  chromium-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installiere Browser-Testumgebung
        run: |
          python -m pip install --disable-pip-version-check playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Echte Chromium-Prüfung (offline, 800x600, 200 Prozent Schrift, Tastatur)
        run: python tests/test_responsive_browser.py
