name: I015.2 / RULE-015 Lifecycle-Revalidierung

on:
  pull_request:
    branches: [main]
    paths:
      - "evidence/I015_2_HISTORICAL_CI_SCOPE.json"
      - ".github/workflows/i015-2-konsolidierungsanalyse.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  pruefung:
    name: RULE-015 / Historische Gates Linter Evidence
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Repository auschecken
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Evidence und kanonische Konsolidierung fail-closed pruefen
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('evidence/I015_2_HISTORICAL_CI_SCOPE.json').read_text(encoding='utf-8'))
          seed = json.loads(Path('data/masterbook_seed.json').read_text(encoding='utf-8'))

          assert data['schema'] == '1.0.0'
          assert data['iteration'] == 'I015.2'
          assert data['typ'] == 'KONSOLIDIERUNGSANALYSE'
          assert data['status'] == 'BESTAETIGT'
          assert data['reifegrad'] == 'E2'
          assert data['prioritaet'] == 'P0'
          assert data['automatisierbarkeit'] == 'JA'
          assert data['goldene_regel'] is False

          d = data['dublettenstrategie']
          assert d['projektregel_status'] == 'E2_BESTAETIGT'
          assert d['kanonischer_masterbuch_abgleich'] == 'RULE-015_KANONISCH_E2_BESTAETIGT'
          assert d['entscheidung'] == 'MIT_RULE_015_KONSOLIDIERT'
          assert d['neue_rule_id'] is False

          rules = [item for item in seed if isinstance(item, dict) and item.get('id') == 'RULE-015']
          assert len(rules) == 1
          rule = rules[0]
          assert rule['maturity'] == 'E2'
          assert rule['status'] == 'bestaetigt'
          assert rule.get('goldene_regel', False) is False

          v = data['validierungsgrenze']
          assert v['i007_historischer_nachlauf_31402618783'] == 'GRUEN'
          assert v['i008_historischer_nachlauf_31407554415'] == 'GRUEN'
          assert v['i009_historischer_nachlauf_31412511481'] == 'GRUEN'
          assert v['i007_bis_i010_scope'] == 'VOLLSTAENDIG_GEHAERTET_TOOLSEITIG'
          assert v['kanonische_konsolidierung'] == 'RULE_015_E2_BESTAETIGT'
          assert v['historische_gate_linter'] == 'PASS_REAL'

          q = data['revalidierung_2026_08_13']
          assert q['typ'] == 'Nachweis'
          assert q['hauptkategorie'] == 'Qualitaetssicherung'
          assert q['tool_pr'] == 55
          assert q['tool_head'] == '030d8657ceba29e30cbb8d319bd5a156872c459b'
          assert q['tool_workflow_run_id'] == 31709297240
          assert q['tool_workflow_conclusion'] == 'success'
          assert q['tool_workflow_id'] == 333628577
          assert q['tool_workflow_path'] == '.github/workflows/historische-gates-linter.yml'
          assert q['tool_workflow_event'] == 'pull_request'
          assert q['tool_head_branch'] == 'automation/historische-gates-linter'
          assert q['tool_merge'] == '3643af81267c5e83cf80f11f0fb94298eba9c022'
          assert q['sha_bound_promotion'] is True
          assert q['status'] == 'PASS_REAL'
          print('LOCAL_RULE_015_REVALIDATION=PASS')
          PY

      - name: Tool-Run, PR und Scope remote binden
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          headers = {
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'Accept': 'application/vnd.github+json',
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          run = get('https://api.github.com/repos/provoware/PROVOWARE/actions/runs/31709297240')
          pr = get('https://api.github.com/repos/provoware/PROVOWARE/pulls/55')
          files = get('https://api.github.com/repos/provoware/PROVOWARE/pulls/55/files?per_page=100')

          assert run['status'] == 'completed'
          assert run['conclusion'] == 'success'
          assert run['head_sha'] == '030d8657ceba29e30cbb8d319bd5a156872c459b'
          assert run['head_branch'] == 'automation/historische-gates-linter'
          assert run['workflow_id'] == 333628577
          assert run['path'] == '.github/workflows/historische-gates-linter.yml'
          assert run['event'] == 'pull_request'

          assert pr['state'] == 'closed'
          assert pr['merged'] is True
          assert pr['head']['sha'] == run['head_sha']
          assert pr['head']['ref'] == run['head_branch']
          assert pr['merge_commit_sha'] == '3643af81267c5e83cf80f11f0fb94298eba9c022'

          changed = {item['filename'] for item in files}
          expected = {
              'docs/HISTORISCHE_GATES.json',
              'docs/HISTORISCHE_GATES_LINTER.md',
              'tools/historical_gate_linter.py',
              '.github/workflows/historische-gates-linter.yml',
          }
          assert changed == expected, (changed, expected)
          print('REMOTE_TOOL_EVIDENCE=PASS')
          PY

      - name: Exakten Masterbuch-Scope fail-closed pruefen
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          number = event['pull_request']['number']
          repo = os.environ['GITHUB_REPOSITORY']
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/pulls/{number}/files?per_page=100',
              headers={
                  'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                  'Accept': 'application/vnd.github+json',
              },
          )
          with urllib.request.urlopen(req) as response:
              changed = {item['filename'] for item in json.load(response)}
          expected = {
              'evidence/I015_2_HISTORICAL_CI_SCOPE.json',
              '.github/workflows/i015-2-konsolidierungsanalyse.yml',
          }
          assert changed == expected, (changed, expected)
          print('MASTERBUCH_SCOPE=PASS')
          PY
