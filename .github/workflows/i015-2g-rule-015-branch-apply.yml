name: I015.2G RULE-015 Branch Apply

on:
  push:
    branches:
      - iteration/i015-2g-rule-015-canonical
    paths:
      - '.github/workflows/i015-2g-rule-015-branch-apply.yml'

permissions:
  contents: write

jobs:
  apply-canonical-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: iteration/i015-2g-rule-015-canonical
      - name: Ausgangszustand fail-closed prüfen
        run: |
          set -Eeuo pipefail
          python scripts/verify_browser_derivatives.py
          python scripts/apply_rule_intake_safe.py
      - name: Qualifizierte Vier-Artefakt-Aufnahme ausführen
        run: |
          set -Eeuo pipefail
          python scripts/apply_rule_intake_safe.py --apply | tee /tmp/rule-015-intake.json
          grep -q '"status": "APPLIED_WITH_ROLLBACK_GUARD"' /tmp/rule-015-intake.json
      - name: Diff-Scope und Zielzustand prüfen
        run: |
          set -Eeuo pipefail
          python scripts/verify_browser_derivatives.py
          python scripts/verify_delta_append_only.py --baseline-ref origin/main
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            data/knowledge-deltas.json
            data/masterbook_seed.json
            src/deltas.js
            src/seed.js
          )
          [[ "${changed[*]}" == "${expected[*]}" ]]
          python - <<'PY'
          import json
          from pathlib import Path
          seed=json.loads(Path('data/masterbook_seed.json').read_text(encoding='utf-8'))
          ledger=json.loads(Path('data/knowledge-deltas.json').read_text(encoding='utf-8'))
          rules=[x for x in seed if x.get('id')=='RULE-015']
          deltas=[x for x in ledger['items'] if x.get('event_id')=='DELTA-0016']
          assert len(rules)==1
          assert len(deltas)==1
          assert rules[0]['maturity']=='E2'
          assert rules[0]['status']=='bestaetigt'
          assert rules[0].get('goldene_regel', False) is False
          assert deltas[0]['entry_id']=='RULE-015'
          assert deltas[0]['after_hash']
          print('RULE_015_CANONICAL_TARGET=PASS')
          PY
      - name: Exakt vier Artefakte als einen Branch-Commit schreiben
        run: |
          set -Eeuo pipefail
          git config user.name 'provoware-automation'
          git config user.email 'automation@users.noreply.github.com'
          git add data/masterbook_seed.json data/knowledge-deltas.json src/seed.js src/deltas.js
          git commit -m 'I015.2G: RULE-015 und DELTA-0016 kanonisch aufnehmen'
          git push origin HEAD:iteration/i015-2g-rule-015-canonical
