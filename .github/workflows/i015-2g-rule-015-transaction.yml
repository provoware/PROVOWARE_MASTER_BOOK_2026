name: I015.2G RULE-015 Vier-Artefakt-Transaktion

on:
  pull_request:
    paths:
      - 'scripts/apply_rule_intake.py'
      - 'evidence/I015_2G_RULE_015_KANDIDAT.json'
      - '.github/workflows/i015-2g-rule-015-transaction.yml'
      - 'scripts/verify_browser_derivatives.py'
      - 'scripts/verify_delta_append_only.py'

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kanonische Derivate und Aufnahmezustand prüfen
        run: |
          python scripts/verify_browser_derivatives.py
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from apply_rule_intake import sha256

          candidate = json.loads(Path('evidence/I015_2G_RULE_015_KANDIDAT.json').read_text(encoding='utf-8'))
          seed = json.loads(Path('data/masterbook_seed.json').read_text(encoding='utf-8'))
          ledger = json.loads(Path('data/knowledge-deltas.json').read_text(encoding='utf-8'))['items']
          rules = [item for item in seed if item.get('id') == 'RULE-015']
          deltas = [item for item in ledger if item.get('event_id') == 'DELTA-0016']
          assert len(rules) <= 1 and len(deltas) <= 1, 'Doppelte kanonische IDs'
          assert bool(rules) == bool(deltas), 'Unvollständige Vier-Artefakt-Aufnahme'
          if rules:
              assert rules[0] == candidate['zielregel'], 'Kanonische Regel weicht vom qualifizierten Kandidaten ab'
              assert deltas[0]['entry_id'] == 'RULE-015'
              assert deltas[0]['after_hash'] == sha256(rules[0]), 'Delta-Hash passt nicht zur Regel'
              assert rules[0]['maturity'] == 'E2' and rules[0]['status'] == 'bestaetigt'
              print('RULE_015_BASELINE=ALREADY_APPLIED_VERIFIED')
          else:
              assert seed[-1]['id'] == 'RULE-014' and ledger[-1]['event_id'] == 'DELTA-0015'
              print('RULE_015_BASELINE=PENDING_VERIFIED')
          PY

      - name: Isolierte Transaktion oder sichere Wiederholungsblockade prüfen
        run: |
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          cp -a "$GITHUB_WORKSPACE/." "$scratch/"
          cd "$scratch"
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          paths = [Path(name) for name in (
              'data/masterbook_seed.json', 'data/knowledge-deltas.json',
              'src/seed.js', 'src/deltas.js'
          )]
          before = [path.read_bytes() for path in paths]
          seed = json.loads(paths[0].read_text(encoding='utf-8'))
          already_applied = any(item.get('id') == 'RULE-015' for item in seed)
          proc = subprocess.run(['python', 'scripts/apply_rule_intake.py', '--apply'],
                                capture_output=True, text=True)
          assert proc.stdout, proc.stderr
          receipt = json.loads(proc.stdout)
          if already_applied:
              assert proc.returncode == 2 and receipt['status'] == 'BLOCKED', receipt
              assert 'existiert bereits' in receipt['reason'], receipt
              assert [path.read_bytes() for path in paths] == before, 'Wiederholung hat Daten verändert'
              print('RULE_015_DUPLICATE_REPLAY=BLOCKED_NO_MUTATION')
          else:
              assert proc.returncode == 0 and receipt['status'] == 'APPLIED', receipt
              print('RULE_015_TRANSACTION=APPLIED_IN_ISOLATION')
          PY
          python scripts/verify_browser_derivatives.py
          python scripts/verify_delta_append_only.py --baseline-ref origin/main

      - name: Original-Checkout muss unverändert bleiben
        run: |
          git diff --exit-code -- data/masterbook_seed.json data/knowledge-deltas.json src/seed.js src/deltas.js
